name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never run two deployments at once; a queued run should win over a running one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet --disable-pip-version-check pillow numpy openpyxl

      - name: Rebuild the dataset from source.jpg + the tile transcriptions
        run: |
          python build/make_tiles.py
          python build/merge.py
          python build/refine.py
          python build/build_dataset.py
          python build/validate.py
          python build/make_xlsx.py
          python build/make_viewer.py

      - name: Assemble the site
        run: |
          mkdir -p _site/dist
          cp viewer/index.html _site/index.html
          cp -r data _site/data
          cp dist/world-history-timeline.xlsx _site/dist/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
